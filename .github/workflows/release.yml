name: Release dylib

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    if: github.repository_owner == 'ahaduoduoduo'
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/.theos-toolchain
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(awk '/^Version:/ {print $2}' control)
          test "$RELEASE_TAG" = "v$version"
      - name: Install build dependencies
        run: |
          brew install ldid xz
          git clone --no-checkout https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout e97b45c6d100fd4107536e634030327d6e8c580b
          git -C "$THEOS" submodule update --init --recursive
      - name: Build release
        run: make clean release
      - name: Upload dylib and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.dylib dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
